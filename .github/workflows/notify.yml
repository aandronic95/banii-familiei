name: Notificări

on:
  schedule:
    - cron: '0 6 * * *'    # zilnic, ~09:00 la Chișinău: scadențe, bugete, plăți recurente, curs BNM
    - cron: '0 16 * * 0'   # duminică seara: rezumatul săptămânii + backup Excel (cui l-a cerut)
    - cron: '30 6 1 * *'   # pe 1 a lunii: raportul PDF pentru luna trecută
  workflow_dispatch:
    inputs:
      task:
        description: 'daily, weekly sau monthly'
        default: daily

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BASE: https://ecfehopapvxngnxecetg.supabase.co/functions/v1
    steps:
      - name: Trimite notificările
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            case "${{ github.event.schedule }}" in
              "0 16 * * 0") TASK=weekly ;;
              "30 6 1 * *") TASK=monthly ;;
              *) TASK=daily ;;
            esac
          fi
          SECRET=$(printf 'cron:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          case "$TASK" in
            weekly)
              curl -sf -X POST "$BASE/notify?task=weekly" -H "x-cron-secret: ${SECRET}"; echo
              curl -sf -X POST "$BASE/docs?type=export&all=1" -H "x-cron-secret: ${SECRET}"; echo ;;
            monthly)
              curl -sf -X POST "$BASE/docs?type=report&all=1" -H "x-cron-secret: ${SECRET}"; echo ;;
            *)
              curl -sf -X POST "$BASE/notify?task=daily" -H "x-cron-secret: ${SECRET}"; echo ;;
          esac
