name: Publicare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 0. Setările instalării: proiectul Supabase (variabila SUPABASE_PROJECT_REF),
  #    cheia publică a proiectului și numele botului (aflate automat din tokenuri).
  #    Așa aceeași copie a codului merge pentru orice familie, fiecare cu baza și botul ei.
  config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.c.outputs.ref }}
      key: ${{ steps.c.outputs.key }}
      bot: ${{ steps.c.outputs.bot }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VAR_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VAR_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - id: c
        name: Citește setările
        run: |
          ORIGINAL="aandronic95/banii-familiei"
          REF="$VAR_REF"
          if [ -z "$REF" ] && [ "$GITHUB_REPOSITORY" = "$ORIGINAL" ]; then REF="ecfehopapvxngnxecetg"; fi
          if [ -z "$REF" ]; then
            echo "::error::Lipsește variabila SUPABASE_PROJECT_REF (Settings → Secrets and variables → Actions → Variables). E codul proiectului din adresa supabase.com/dashboard/project/<cod>."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Lipsesc secretele SUPABASE_ACCESS_TOKEN și/sau TELEGRAM_BOT_TOKEN (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi
          # Cheia publică a proiectului (nu cea secretă!) — e făcută să stea în aplicație
          KEY="$VAR_KEY"
          if [ -z "$KEY" ]; then
            KEY=$(supabase projects api-keys --project-ref "$REF" -o json 2>/dev/null \
              | jq -r '([.[] | select(.type == "publishable")][0].api_key) // ([.[] | select(.name == "anon")][0].api_key) // empty')
          fi
          if [ -z "$KEY" ] && [ "$GITHUB_REPOSITORY" = "$ORIGINAL" ]; then KEY="sb_publishable__X0T3eKwVwWhl5Qylz8plg_mpT9S4Sf"; fi
          if [ -z "$KEY" ]; then
            echo "::error::Nu am putut afla cheia publică a proiectului $REF. Verifică SUPABASE_ACCESS_TOKEN sau pune cheia în variabila SUPABASE_PUBLISHABLE_KEY (Project Settings → API Keys → Publishable key)."
            exit 1
          fi
          case "$KEY" in sb_secret_*) echo "::error::Cheia găsită e secretă, nu publică. Pune cheia publică în SUPABASE_PUBLISHABLE_KEY."; exit 1 ;; esac
          # Numele botului, direct de la Telegram
          BOT=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -r '.result.username // empty')
          if [ -z "$BOT" ]; then echo "::error::Tokenul botului nu e valid (TELEGRAM_BOT_TOKEN)."; exit 1; fi
          echo "Proiect Supabase: $REF · bot: @$BOT · cheie publică: ${KEY:0:16}…"
          { echo "ref=$REF"; echo "key=$KEY"; echo "bot=$BOT"; } >> "$GITHUB_OUTPUT"

  # 1. Aplicația Vue → GitHub Pages
  pages:
    needs: config
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://${{ needs.config.outputs.ref }}.supabase.co
          VITE_SUPABASE_KEY: ${{ needs.config.outputs.key }}
          VITE_BOT_USERNAME: ${{ needs.config.outputs.bot }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # 2. Baza de date, funcțiile serverului și botul Telegram
  backend:
    needs: config
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ needs.config.outputs.ref }}
      BOT_USERNAME: ${{ needs.config.outputs.bot }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Verifică secretele
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD TELEGRAM_BOT_TOKEN; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele din GitHub (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
          [ -z "$OWNER_TELEGRAM_ID" ] && echo "::warning::OWNER_TELEGRAM_ID lipsește: aplicația îți va arăta ID-ul, apoi adaugă-l și rulează din nou."
          true
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Leagă proiectul Supabase
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Aplică schema bazei de date
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Setează secretele serverului
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            OWNER_TELEGRAM_ID="${OWNER_TELEGRAM_ID:-0}" \
            APP_URL="$APP_URL"
      - name: Publică funcțiile
        run: supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Configurează botul Telegram
        run: |
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          WEBHOOK_SECRET=$(printf 'webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          curl -sf "$API/setWebhook" -H 'content-type: application/json' \
            -d "{\"url\":\"https://${PROJECT_REF}.supabase.co/functions/v1/bot\",\"secret_token\":\"${WEBHOOK_SECRET}\",\"allowed_updates\":[\"message\",\"callback_query\"]}" > /dev/null
          curl -sf "$API/setChatMenuButton" -H 'content-type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Deschide\",\"web_app\":{\"url\":\"${APP_URL}\"}}}" > /dev/null
          curl -sf "$API/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Deschide aplicația"},{"command":"ajutor","description":"Cum adaug o cheltuială prin mesaj"},{"command":"sarcini","description":"Sarcinile deschise"},{"command":"cumparaturi","description":"Lista de cumpărături"},{"command":"id","description":"Arată ID-ul tău Telegram"}]}' > /dev/null
          echo "Bot configurat: https://t.me/${BOT_USERNAME}"
      - name: Verifică funcțiile publicate
        run: |
          BASE="https://${PROJECT_REF}.supabase.co/functions/v1"
          W=$(curl -s -o /tmp/w -w '%{http_code}' -X POST "$BASE/wallet" -H 'content-type: application/json' \
            -d '{"token":"cheie-falsa-pentru-test-000000000000","amount":"10,00 MDL","merchant":"Test","card":"x"}')
          echo "wallet cu cheie falsă: $W $(cat /tmp/w)"
          [ "$W" = "401" ] || { echo "::error::wallet trebuia să respingă cheia falsă (401), a răspuns $W"; exit 1; }
          R=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "$BASE/rates" -H 'content-type: application/json' -d '{}')
          echo "rates fără login: $R"
          [ "$R" = "401" ] || { echo "::error::rates trebuia să ceară login (401), a răspuns $R"; exit 1; }
          A=$(curl -s -o /tmp/a -w '%{http_code}' -X POST "$BASE/tg-auth" -H 'content-type: application/json' -d '{"initData":"user=%7B%22id%22%3A1%7D&hash=00"}')
          echo "tg-auth cu semnătură falsă: $A"
          [ "$A" = "401" ] || { echo "::error::tg-auth trebuia să respingă semnătura falsă (401), a răspuns $A"; exit 1; }
          D=$(curl -s -o /tmp/d -w '%{http_code}' -X POST "$BASE/docs?type=export" -H 'content-type: application/json' -d '{}')
          echo "docs fără login: $D"
          [ "$D" = "401" ] || { echo "::error::docs trebuia să ceară login (401), a răspuns $D"; exit 1; }
          DA=$(curl -s -o /tmp/da -w '%{http_code}' -X POST "$BASE/docs?type=export&all=1")
          echo "docs programat fără secret: $DA"
          [ "$DA" = "403" ] || { echo "::error::docs programat trebuia să ceară secretul (403), a răspuns $DA"; exit 1; }
          PN=$(curl -s -o /tmp/pn -w '%{http_code}' -X POST "$BASE/pin" -H 'content-type: application/json' -d '{"action":"verify","pin":"1234"}')
          echo "pin fără login: $PN"
          [ "$PN" = "401" ] || { echo "::error::pin trebuia să ceară login (401), a răspuns $PN"; exit 1; }
          AL=$(curl -s -o /tmp/al -w '%{http_code}' -X POST "$BASE/alert" -H 'content-type: application/json' -d '{"id":"00000000-0000-0000-0000-000000000000"}')
          echo "alert fără login: $AL"
          [ "$AL" = "401" ] || { echo "::error::alert trebuia să ceară login (401), a răspuns $AL"; exit 1; }
